name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
        if: matrix.os == 'ubuntu-latest'

      # Nimby installs packages as siblings of the workspace root, so the
      # workspace has to be the parent of this checkout: paddy then sits inside
      # it next to its dependencies and nim finds nim.cfg by walking up.
      - name: Create a Nimby workspace
        shell: bash
        run: |
          cd ..
          nimby create

      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby install paddy/paddy.nimble

      - run: nim r tests/test_scan_linux.nim
        if: matrix.os == 'ubuntu-latest'
      - run: nim check src/paddy.nim
      - run: nim r tests/tests.nim
      - run: nim r tests/test_scan_native.nim
      - run: nim r tests/test_windows_discovery.nim
        if: matrix.os == 'windows-latest'
      - run: nim r tests/test_scan_windows.nim
      - run: nim r tests/test_scan_macos.nim
      - run: nim r tests/test_scan_emscripten.nim
      - run: nim r tests/test_scan_macos_native.nim
        if: matrix.os == 'macos-latest'

      - uses: mymindstorm/setup-emsdk@v14
        if: matrix.os == 'ubuntu-latest'
      - name: Test browser discovery
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          nim c tests/web/test_scan_browser.nim
          google-chrome --headless --no-sandbox --disable-gpu \
            --user-data-dir="$RUNNER_TEMP/paddy-browser" \
            --virtual-time-budget=10000 --dump-dom \
            "file://$PWD/tests/web/test_scan_browser.html" > "$RUNNER_TEMP/paddy-browser.html"
          grep -q 'data-paddy-result="passed"' "$RUNNER_TEMP/paddy-browser.html"
