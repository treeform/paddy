name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
        if: matrix.os == 'ubuntu-latest'

      # Nimby installs packages as siblings of the workspace root, so the
      # workspace has to be the parent of this checkout: paddy then sits inside
      # it next to its dependencies and nim finds nim.cfg by walking up.
      - name: Create a Nimby workspace
        shell: bash
        run: |
          cd ..
          nimby create

      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby install paddy/paddy.nimble

      - run: nim check src/paddy.nim
      - run: nim r tests/tests.nim
